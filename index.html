<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La 🤍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #160b24, #3b155f, #14091f);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

.name {
    font-family: Georgia, serif;
    font-size: 75px;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 22px;
    margin-bottom: 35px;
}

.heart {
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.2);
    }
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    padding: 25px;
    backdrop-filter: blur(10px);
}

.card h2 {
    margin-top: 0;
    font-size: 22px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.box {
    background: rgba(0,0,0,0.25);
    border-radius: 15px;
    padding: 15px 5px;
}

.number {
    font-size: 28px;
    font-weight: bold;
}

.label {
    font-size: 12px;
    opacity: 0.75;
    margin-top: 5px;
}

.error {
    color: #ffb4b4;
    margin-top: 15px;
    display: none;
}

@media (max-width: 650px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .name {
        font-size: 60px;
    }

    .subtitle {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="name">La</div>

    <div class="subtitle">
        كم باقي لميلاد أجمل مخلوقة بالكون
        <span class="heart">♡</span>
    </div>

    <div class="cards">

        <div class="card">
            <h2>🎂 الميلاد الميلادي</h2>

            <div class="countdown">
                <div class="box">
                    <div class="number" id="gDays">--</div>
                    <div class="label">يوم</div>
                </div>

                <div class="box">
                    <div class="number" id="gHours">--</div>
                    <div class="label">ساعة</div>
                </div>

                <div class="box">
                    <div class="number" id="gMinutes">--</div>
                    <div class="label">دقيقة</div>
                </div>

                <div class="box">
                    <div class="number" id="gSeconds">--</div>
                    <div class="label">ثانية</div>
                </div>
            </div>
        </div>


        <div class="card">
            <h2>🌙 الميلاد الهجري</h2>

            <div class="countdown">
                <div class="box">
                    <div class="number" id="hDays">--</div>
                    <div class="label">يوم</div>
                </div>

                <div class="box">
                    <div class="number" id="hHours">--</div>
                    <div class="label">ساعة</div>
                </div>

                <div class="box">
                    <div class="number" id="hMinutes">--</div>
                    <div class="label">دقيقة</div>
                </div>

                <div class="box">
                    <div class="number" id="hSeconds">--</div>
                    <div class="label">ثانية</div>
                </div>
            </div>

            <div class="error" id="error">
                تعذر حساب التاريخ الهجري
            </div>
        </div>

    </div>
</div>


<script>

/* =========================
   الميلاد الميلادي
   7 مايو
========================= */

function getNextGregorianBirthday() {

    const now = new Date();

    let target = new Date(
        now.getFullYear(),
        4,
        7,
        0,
        0,
        0
    );

    if (target <= now) {
        target = new Date(
            now.getFullYear() + 1,
            4,
            7,
            0,
            0,
            0
        );
    }

    return target;
}


/* =========================
   التاريخ الهجري
   2 جمادى الأولى
   باستخدام أم القرى
========================= */

const hijriFormatter =
    new Intl.DateTimeFormat(
        "en-US-u-ca-islamic-umalqura",
        {
            day: "numeric",
            month: "numeric",
            year: "numeric",
            timeZone: "Asia/Riyadh"
        }
    );


function getHijriDate(date) {

    const parts = hijriFormatter.formatToParts(date);

    let day = null;
    let month = null;
    let year = null;

    for (const part of parts) {

        if (part.type === "day") {
            day = Number(part.value);
        }

        if (part.type === "month") {
            month = Number(part.value);
        }

        if (part.type === "year") {
            year = Number(part.value);
        }
    }

    return {
        day,
        month,
        year
    };
}


/* 
   يبحث عن أقرب يوم:
   2 / 5 هجري
*/

function findNextHijriBirthday() {

    const now = new Date();

    let date = new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate(),
        0,
        0,
        0
    );

    for (let i = 0; i < 400; i++) {

        const hijri = getHijriDate(date);

        if (
            hijri.day === 2 &&
            hijri.month === 5
        ) {

            return new Date(
                date.getFullYear(),
                date.getMonth(),
                date.getDate(),
                0,
                0,
                0
            );
        }

        date.setDate(date.getDate() + 1);
    }

    return null;
}


/* =========================
   تحويل الوقت إلى عداد
========================= */

function updateCountdown(target, prefix) {

    const now = new Date();

    let difference = target - now;

    if (difference < 0) {
        difference = 0;
    }

    const totalSeconds =
        Math.floor(difference / 1000);

    const days =
        Math.floor(totalSeconds / 86400);

    const hours =
        Math.floor((totalSeconds % 86400) / 3600);

    const minutes =
        Math.floor((totalSeconds % 3600) / 60);

    const seconds =
        totalSeconds % 60;


    document.getElementById(prefix + "Days").textContent =
        String(days).padStart(2, "0");

    document.getElementById(prefix + "Hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById(prefix + "Minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById(prefix + "Seconds").textContent =
        String(seconds).padStart(2, "0");
}


/* =========================
   تشغيل
========================= */

function updateAll() {

    const gregorianTarget =
        getNextGregorianBirthday();

    updateCountdown(
        gregorianTarget,
        "g"
    );


    const hijriTarget =
        findNextHijriBirthday();

    if (hijriTarget) {

        document.getElementById("error")
            .style.display = "none";

        updateCountdown(
            hijriTarget,
            "h"
        );

    } else {

        document.getElementById("error")
            .style.display = "block";

    }
}


updateAll();

setInterval(updateAll, 1000);

</script>

</body>
</html>
