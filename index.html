<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La 🤍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top, #70408f 0%, transparent 42%),
        linear-gradient(135deg, #120817, #291039, #100611);
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

.name {
    font-family: Georgia, serif;
    font-size: 80px;
    margin: 0 0 5px;
}

.subtitle {
    font-size: 21px;
    margin-bottom: 35px;
}

.heart {
    display: inline-block;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.25);
    }
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    padding: 28px 20px;
    border-radius: 25px;

    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.16);

    box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    backdrop-filter: blur(12px);
}

.card h2 {
    margin: 0 0 22px;
    font-size: 21px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.box {
    padding: 14px 4px;
    border-radius: 15px;
    background: rgba(0,0,0,0.25);
}

.number {
    font-size: 27px;
    font-weight: bold;
}

.label {
    margin-top: 5px;
    font-size: 12px;
    opacity: 0.7;
}

@media (max-width: 650px) {

    .cards {
        grid-template-columns: 1fr;
    }

    .name {
        font-size: 65px;
    }

    .subtitle {
        font-size: 18px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="name">La</div>

    <div class="subtitle">
        كم باقي لميلاد أجمل مخلوقة بالكون
        <span class="heart">♡</span>
    </div>

    <div class="cards">

        <!-- الميلاد الميلادي -->
        <div class="card">

            <h2>🎂 الميلاد الميلادي</h2>

            <div class="countdown">

                <div class="box">
                    <div class="number" id="gDays">00</div>
                    <div class="label">يوم</div>
                </div>

                <div class="box">
                    <div class="number" id="gHours">00</div>
                    <div class="label">ساعة</div>
                </div>

                <div class="box">
                    <div class="number" id="gMinutes">00</div>
                    <div class="label">دقيقة</div>
                </div>

                <div class="box">
                    <div class="number" id="gSeconds">00</div>
                    <div class="label">ثانية</div>
                </div>

            </div>

        </div>


        <!-- الميلاد الهجري -->
        <div class="card">

            <h2>🌙 الميلاد الهجري</h2>

            <div class="countdown">

                <div class="box">
                    <div class="number" id="hDays">00</div>
                    <div class="label">يوم</div>
                </div>

                <div class="box">
                    <div class="number" id="hHours">00</div>
                    <div class="label">ساعة</div>
                </div>

                <div class="box">
                    <div class="number" id="hMinutes">00</div>
                    <div class="label">دقيقة</div>
                </div>

                <div class="box">
                    <div class="number" id="hSeconds">00</div>
                    <div class="label">ثانية</div>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   التاريخ الميلادي
   7 مايو
========================================= */

function getGregorianTarget() {

    const now = new Date();

    let target = new Date(
        now.getFullYear(),
        4,
        7,
        0,
        0,
        0,
        0
    );

    if (target <= now) {

        target = new Date(
            now.getFullYear() + 1,
            4,
            7,
            0,
            0,
            0,
            0
        );
    }

    return target;
}


/* =========================================
   التاريخ الهجري
   2 جمادى الأولى 1448
   = 13 أكتوبر 2026
========================================= */

function getHijriTarget() {

    const now = new Date();

    let target = new Date(
        2026,
        9,
        13,
        0,
        0,
        0,
        0
    );

    /*
       إذا انتهى موعد 2026،
       ننتقل للموعد الهجري التالي.
    */

    while (target <= now) {

        target.setDate(
            target.getDate() + 354
        );
    }

    return target;
}


/* =========================================
   العد الحقيقي
========================================= */

function countdown(target, prefix) {

    const now = new Date();

    const difference = Math.max(
        0,
        target.getTime() - now.getTime()
    );


    /*
       نحسب كل شيء من الثواني المتبقية
    */

    let totalSeconds =
        Math.floor(difference / 1000);


    const days =
        Math.floor(totalSeconds / 86400);

    totalSeconds -= days * 86400;


    const hours =
        Math.floor(totalSeconds / 3600);

    totalSeconds -= hours * 3600;


    const minutes =
        Math.floor(totalSeconds / 60);

    const seconds =
        totalSeconds - minutes * 60;


    document.getElementById(prefix + "Days")
        .textContent =
        String(days).padStart(2, "0");


    document.getElementById(prefix + "Hours")
        .textContent =
        String(hours).padStart(2, "0");


    document.getElementById(prefix + "Minutes")
        .textContent =
        String(minutes).padStart(2, "0");


    document.getElementById(prefix + "Seconds")
        .textContent =
        String(seconds).padStart(2, "0");
}


/* =========================================
   تشغيل العدادين
========================================= */

function update() {

    countdown(
        getGregorianTarget(),
        "g"
    );

    countdown(
        getHijriTarget(),
        "h"
    );
}


/* تشغيل فورًا */
update();


/* تحديث كل ثانية */
setInterval(
    update,
    1000
);

</script>

</body>
</html>
