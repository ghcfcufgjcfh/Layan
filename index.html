<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La ♡</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: "Segoe UI", Tahoma, sans-serif;
    color: #fff;
    background:
        radial-gradient(circle at 20% 20%, #5b3158 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #33234d 0%, transparent 40%),
        linear-gradient(135deg, #120d19, #211426, #100b16);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

.container {
    width: 92%;
    max-width: 700px;
    text-align: center;
    padding: 35px 20px;
}

.la {
    font-family: Georgia, serif;
    font-size: 90px;
    letter-spacing: 8px;
    font-weight: 400;
    margin-bottom: 10px;
    text-shadow: 0 0 35px rgba(255,255,255,.25);
}

.subtitle {
    font-size: 20px;
    color: #e7cfe2;
    margin-bottom: 35px;
}

.heart {
    display: inline-block;
    margin: 0 8px;
    animation: heartbeat 1.7s infinite;
}

.card {
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    backdrop-filter: blur(15px);
    border-radius: 28px;
    padding: 25px 18px;
    margin: 18px 0;
    box-shadow: 0 15px 50px rgba(0,0,0,.25);
}

.title {
    font-size: 16px;
    color: #cdb9ca;
    margin-bottom: 18px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 9px;
}

.box {
    background: rgba(0,0,0,.18);
    border-radius: 18px;
    padding: 15px 5px;
}

.number {
    font-size: clamp(25px, 7vw, 42px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.label {
    color: #a99aa8;
    font-size: 12px;
    margin-top: 5px;
}

.date {
    margin-top: 17px;
    color: #a99aa8;
    font-size: 13px;
}

.footer {
    margin-top: 28px;
    color: #796d78;
    font-size: 12px;
}

@keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
}

@media (max-width: 450px) {
    .la {
        font-size: 70px;
    }

    .subtitle {
        font-size: 17px;
    }

    .card {
        padding: 20px 10px;
    }

    .box {
        padding: 13px 3px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="la">La</div>

    <div class="subtitle">
        <span class="heart">♡</span>
        كم باقي لميلاد أجمل مخلوقة بالكون
        <span class="heart">♡</span>
    </div>


    <!-- الميلادي -->
    <div class="card">

        <div class="title">
            الميلاد الميلادي · 7 مايو
        </div>

        <div class="countdown" id="gregorian">
            <div class="box">
                <div class="number" id="gDays">00</div>
                <div class="label">يوم</div>
            </div>

            <div class="box">
                <div class="number" id="gHours">00</div>
                <div class="label">ساعة</div>
            </div>

            <div class="box">
                <div class="number" id="gMinutes">00</div>
                <div class="label">دقيقة</div>
            </div>

            <div class="box">
                <div class="number" id="gSeconds">00</div>
                <div class="label">ثانية</div>
            </div>
        </div>

        <div class="date">
            7 مايو 2008 · ميلاد La
        </div>

    </div>


    <!-- الهجري -->
    <div class="card">

        <div class="title">
            الميلاد الهجري · 2 جمادى الأولى
        </div>

        <div class="countdown" id="hijri">
            <div class="box">
                <div class="number" id="hDays">00</div>
                <div class="label">يوم</div>
            </div>

            <div class="box">
                <div class="number" id="hHours">00</div>
                <div class="label">ساعة</div>
            </div>

            <div class="box">
                <div class="number" id="hMinutes">00</div>
                <div class="label">دقيقة</div>
            </div>

            <div class="box">
                <div class="number" id="hSeconds">00</div>
                <div class="label">ثانية</div>
            </div>
        </div>

        <div class="date" id="hijriDate">
            2 جمادى الأولى
        </div>

    </div>


    <div class="footer">
        Made with ♡ for La
    </div>

</div>


<script>

function pad(number) {
    return String(number).padStart(2, "0");
}


/* =========================
   الميلادي
========================= */

function getNextGregorianBirthday() {

    const now = new Date();

    let year = now.getFullYear();

    let birthday = new Date(
        year,
        4,      // مايو = 4
        7,
        0, 0, 0
    );

    if (birthday <= now) {
        birthday = new Date(
            year + 1,
            4,
            7,
            0, 0, 0
        );
    }

    return birthday;
}


function updateGregorian() {

    const now = new Date();
    const birthday = getNextGregorianBirthday();

    let difference = birthday - now;

    let totalSeconds = Math.floor(difference / 1000);

    const days = Math.floor(totalSeconds / 86400);

    totalSeconds %= 86400;

    const hours = Math.floor(totalSeconds / 3600);

    totalSeconds %= 3600;

    const minutes = Math.floor(totalSeconds / 60);

    const seconds = totalSeconds % 60;


    document.getElementById("gDays").textContent = pad(days);
    document.getElementById("gHours").textContent = pad(hours);
    document.getElementById("gMinutes").textContent = pad(minutes);
    document.getElementById("gSeconds").textContent = pad(seconds);
}



/* =========================
   الهجري
========================= */

const hijriMonths = [
    "محرم",
    "صفر",
    "ربيع الأول",
    "ربيع الآخر",
    "جمادى الأولى",
    "جمادى الآخرة",
    "رجب",
    "شعبان",
    "رمضان",
    "شوال",
    "ذو القعدة",
    "ذو الحجة"
];


function getHijriDate(date) {

    const formatter = new Intl.DateTimeFormat(
        "ar-SA-u-ca-islamic-umalqura",
        {
            day: "numeric",
            month: "numeric",
            year: "numeric"
        }
    );

    const parts = formatter.formatToParts(date);

    let day;
    let month;
    let year;

    parts.forEach(part => {

        if (part.type === "day")
            day = Number(part.value);

        if (part.type === "month")
            month = Number(part.value);

        if (part.type === "year")
            year = Number(part.value);

    });

    return {
        day,
        month,
        year
    };
}


function getNextHijriBirthday() {

    const now = new Date();

    const current = getHijriDate(now);

    let year = current.year;

    if (
        current.month > 5 ||
        (current.month === 5 && current.day >= 2)
    ) {
        year++;
    }

    /*
       نبحث عن اليوم الميلادي الذي يوافق
       2 جمادى الأولى من السنة الهجرية القادمة.
    */

    let test = new Date(
        now.getTime()
    );

    for (let i = 0; i < 500; i++) {

        const h = getHijriDate(test);

        if (
            h.year === year &&
            h.month === 5 &&
            h.day === 2
        ) {

            test.setHours(0, 0, 0, 0);

            return test;
        }

        test.setDate(test.getDate() + 1);
    }

    return now;
}


function updateHijri() {

    const now = new Date();

    const birthday = getNextHijriBirthday();

    let difference = birthday - now;

    let totalSeconds = Math.max(
        0,
        Math.floor(difference / 1000)
    );

    const days = Math.floor(totalSeconds / 86400);

    totalSeconds %= 86400;

    const hours = Math.floor(totalSeconds / 3600);

    totalSeconds %= 3600;

    const minutes = Math.floor(totalSeconds / 60);

    const seconds = totalSeconds % 60;


    document.getElementById("hDays").textContent = pad(days);
    document.getElementById("hHours").textContent = pad(hours);
    document.getElementById("hMinutes").textContent = pad(minutes);
    document.getElementById("hSeconds").textContent = pad(seconds);


    const h = getHijriDate(birthday);

    document.getElementById("hijriDate").textContent =
        `2 جمادى الأولى ${h.year} هـ`;
}


/* تحديث مباشر */

function updateAll() {

    updateGregorian();
    updateHijri();

}

updateAll();

setInterval(updateAll, 1000);

</script>

</body>
</html>
