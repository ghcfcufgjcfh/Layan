<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>La 🤍</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at top, #75438f 0%, transparent 45%),
        linear-gradient(135deg, #120817, #2b103d, #100611);
}

.container {
    width: 100%;
    max-width: 900px;
    text-align: center;
}

.name {
    font-family: Georgia, serif;
    font-size: 80px;
    margin: 0;
}

.subtitle {
    font-size: 21px;
    margin: 8px 0 35px;
}

.heart {
    display: inline-block;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        transform: scale(1.25);
    }
}

.cards {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    padding: 28px 20px;
    border-radius: 25px;

    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.16);

    box-shadow: 0 15px 40px rgba(0,0,0,0.25);

    backdrop-filter: blur(12px);
}

.card h2 {
    margin: 0 0 22px;
    font-size: 21px;
}

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.box {
    padding: 15px 5px;
    border-radius: 15px;
    background: rgba(0,0,0,0.25);
}

.number {
    font-size: 28px;
    font-weight: bold;
}

.label {
    margin-top: 5px;
    font-size: 12px;
    opacity: 0.7;
}

@media (max-width: 650px) {
    .cards {
        grid-template-columns: 1fr;
    }

    .name {
        font-size: 65px;
    }

    .subtitle {
        font-size: 18px;
    }
}
</style>
</head>


<body>

<div class="container">

    <div class="name">La</div>

    <div class="subtitle">
        كم باقي لميلاد أجمل مخلوقة بالكون
        <span class="heart">♡</span>
    </div>


    <div class="cards">

        <!-- الميلادي -->

        <div class="card">

            <h2>🎂 الميلاد الميلادي</h2>

            <div class="countdown">

                <div class="box">
                    <div class="number" id="gDays">00</div>
                    <div class="label">يوم</div>
                </div>

                <div class="box">
                    <div class="number" id="gHours">00</div>
                    <div class="label">ساعة</div>
                </div>

                <div class="box">
                    <div class="number" id="gMinutes">00</div>
                    <div class="label">دقيقة</div>
                </div>

                <div class="box">
                    <div class="number" id="gSeconds">00</div>
                    <div class="label">ثانية</div>
                </div>

            </div>

        </div>


        <!-- الهجري -->

        <div class="card">

            <h2>🌙 الميلاد الهجري</h2>

            <div class="countdown">

                <div class="box">
                    <div class="number" id="hDays">00</div>
                    <div class="label">يوم</div>
                </div>

                <div class="box">
                    <div class="number" id="hHours">00</div>
                    <div class="label">ساعة</div>
                </div>

                <div class="box">
                    <div class="number" id="hMinutes">00</div>
                    <div class="label">دقيقة</div>
                </div>

                <div class="box">
                    <div class="number" id="hSeconds">00</div>
                    <div class="label">ثانية</div>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =====================================
   الميلادي
   7 مايو
===================================== */

function getGregorianTarget() {

    const now = new Date();

    let target = new Date(
        now.getFullYear(),
        4,
        7,
        0,
        0,
        0,
        0
    );

    if (target <= now) {

        target = new Date(
            now.getFullYear() + 1,
            4,
            7,
            0,
            0,
            0,
            0
        );
    }

    return target;
}


/* =====================================
   الهجري
   2 جمادى الأولى
===================================== */

const hijriFormatter = new Intl.DateTimeFormat(
    "en-US-u-ca-islamic-umalqura",
    {
        day: "numeric",
        month: "numeric",
        year: "numeric",
        timeZone: "Asia/Riyadh"
    }
);


function getHijriParts(date) {

    const parts =
        hijriFormatter.formatToParts(date);

    let day = 0;
    let month = 0;
    let year = 0;

    for (const part of parts) {

        if (part.type === "day") {
            day = Number(part.value);
        }

        if (part.type === "month") {
            month = Number(part.value);
        }

        if (part.type === "year") {
            year = Number(part.value);
        }
    }

    return {
        day,
        month,
        year
    };
}


function getHijriTarget() {

    const now = new Date();

    let date = new Date(now);

    date.setHours(
        0,
        0,
        0,
        0
    );


    /*
       نبحث عن:
       اليوم 2
       الشهر 5 = جمادى الأولى
    */

    for (let i = 0; i < 370; i++) {

        const hijri =
            getHijriParts(date);


        if (
            hijri.day === 2 &&
            hijri.month === 5
        ) {

            return new Date(
                date.getFullYear(),
                date.getMonth(),
                date.getDate(),
                0,
                0,
                0,
                0
            );
        }


        date.setDate(
            date.getDate() + 1
        );
    }


    return null;
}


/* =====================================
   العداد
===================================== */

function updateCountdown(target, prefix) {

    if (!target) {
        return;
    }

    const now = new Date();

    let remaining =
        target.getTime() -
        now.getTime();


    if (remaining < 0) {
        remaining = 0;
    }


    const days =
        Math.floor(
            remaining / 86400000
        );


    remaining =
        remaining % 86400000;


    const hours =
        Math.floor(
            remaining / 3600000
        );


    remaining =
        remaining % 3600000;


    const minutes =
        Math.floor(
            remaining / 60000
        );


    const seconds =
        Math.floor(
            (remaining % 60000) / 1000
        );


    document.getElementById(
        prefix + "Days"
    ).textContent =
        String(days).padStart(2, "0");


    document.getElementById(
        prefix + "Hours"
    ).textContent =
        String(hours).padStart(2, "0");


    document.getElementById(
        prefix + "Minutes"
    ).textContent =
        String(minutes).padStart(2, "0");


    document.getElementById(
        prefix + "Seconds"
    ).textContent =
        String(seconds).padStart(2, "0");
}


/* =====================================
   التشغيل
===================================== */

function updateAll() {

    const gregorian =
        getGregorianTarget();

    const hijri =
        getHijriTarget();


    updateCountdown(
        gregorian,
        "g"
    );


    updateCountdown(
        hijri,
        "h"
    );
}


updateAll();


setInterval(
    updateAll,
    1000
);

</script>

</body>
</html>
